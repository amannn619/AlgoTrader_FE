<h2 mat-dialog-title>Start Market Session</h2>
<mat-dialog-content>
  <div class="form-container">
    <mat-form-field appearance="outline">
      <mat-label>Client ID</mat-label>
      <input matInput [(ngModel)]="data.clientId" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Password</mat-label>
      <input matInput type="password" [(ngModel)]="data.password" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>API Key</mat-label>
      <input matInput type="password" [(ngModel)]="data.apiKey" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>TOTP</mat-label>
      <input
        matInput
        [(ngModel)]="data.totp"
        placeholder="Authenticator Code"
      />
    </mat-form-field>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-raised-button color="primary" [mat-dialog-close]="data">
    Start Session
  </button>
</mat-dialog-actions>
