<div class="dashboard-container">
  <div class="section-header">
    <h3>Market Watch</h3>
    <span class="subtitle"
      >Live tracking of
      {{ (stocks$ | async | keyvalue)?.length }} instruments</span
    >
  </div>

  <div class="grid">
    <app-stock-tile
      *ngFor="let item of stocks$ | async | keyvalue; trackBy: trackBySymbol"
      [stock]="item.value"
    >
    </app-stock-tile>
  </div>
</div>
